{{ define "main" }}
<div class="space-y-8 max-w-3xl mx-auto" x-data="{
  options: {{ .Site.Data.calculation | jsonify }},
  selectedTime: 60,
  selectedDigitNo: 2,
  selectedOperator: '+',
  selectedInterval: 3,

  // Game state
  gameState: 'idle', // 'idle', 'playing', 'finished'
  timeLeft: 60,
  score: 0,
  totalAnswered: 0,
  currentNum1: 0,
  currentNum2: 0,
  userAnswer: '',
  feedback: '',
  timerInterval: null,
  problemTimeout: null,

  generateProblem() {
    this.userAnswer = '';
    this.feedback = '';

    const max = Math.pow(10, parseInt(this.selectedDigitNo, 10)) - 1;
    const min = Math.pow(10, parseInt(this.selectedDigitNo, 10) - 1);

    this.currentNum1 = Math.floor(Math.random() * (max - min + 1)) + min;
    this.currentNum2 = Math.floor(Math.random() * (max - min + 1)) + min;

    // For division or subtraction, ensure clean numbers
    if (this.selectedOperator === '-') {
      if (this.currentNum1 < this.currentNum2) {
        [this.currentNum1, this.currentNum2] = [this.currentNum2, this.currentNum1];
      }
    } else if (this.selectedOperator === '/') {
      this.currentNum2 = Math.floor(Math.random() * 9) + 2;
      this.currentNum1 = this.currentNum2 * (Math.floor(Math.random() * 20) + 1);
    }

    this.$nextTick(() => {
      const input = document.getElementById('mathAnswerInput');
      if (input) input.focus();
    });
  },

  get expectedAnswer() {
    switch (this.selectedOperator) {
      case '+': return this.currentNum1 + this.currentNum2;
      case '-': return this.currentNum1 - this.currentNum2;
      case '*': return this.currentNum1 * this.currentNum2;
      case '/': return Math.floor(this.currentNum1 / this.currentNum2);
      default: return 0;
    }
  },

  checkAnswer() {
    if (this.userAnswer === '') return;
    const val = parseInt(this.userAnswer, 10);
    this.totalAnswered++;

    if (val === this.expectedAnswer) {
      this.score++;
      this.feedback = 'correct';
    } else {
      this.feedback = 'incorrect';
    }

    setTimeout(() => {
      if (this.gameState === 'playing') {
        this.generateProblem();
      }
    }, 400);
  },

  startGame() {
    this.gameState = 'playing';
    this.score = 0;
    this.totalAnswered = 0;
    this.timeLeft = parseInt(this.selectedTime, 10);
    this.generateProblem();

    clearInterval(this.timerInterval);
    this.timerInterval = setInterval(() => {
      this.timeLeft--;
      if (this.timeLeft <= 0) {
        this.endGame();
      }
    }, 1000);
  },

  endGame() {
    clearInterval(this.timerInterval);
    this.gameState = 'finished';
  },

  resetGame() {
    clearInterval(this.timerInterval);
    this.gameState = 'idle';
  }
}">

  <div class="text-center space-y-2 border-b border-slate-200 pb-4">
    <h1 class="text-3xl font-extrabold text-slate-900">⚡ Mental Math Calculation Trainer</h1>
    <p class="text-slate-500 text-sm">Rapid arithmetic drills to sharpen concentration and calculation speed</p>
  </div>

  <!-- Settings (Idle State) -->
  <div x-show="gameState === 'idle'" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
    <h2 class="text-lg font-bold text-slate-800 border-b border-slate-100 pb-3">Training Configuration</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
      <!-- Game Time -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Game Duration</label>
        <select
          x-model="selectedTime"
          class="w-full px-4 py-2.5 rounded-xl border border-slate-300 font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500"
        >
          <template x-for="t in options.timeOptions" :key="t.value">
            <option :value="t.value" x-text="t.label"></option>
          </template>
        </select>
      </div>

      <!-- Digits -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Digit Length</label>
        <select
          x-model="selectedDigitNo"
          class="w-full px-4 py-2.5 rounded-xl border border-slate-300 font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500"
        >
          <template x-for="d in options.digitOptions" :key="d.value">
            <option :value="d.value" x-text="d.label"></option>
          </template>
        </select>
      </div>

      <!-- Operator -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Arithmetic Operation</label>
        <select
          x-model="selectedOperator"
          class="w-full px-4 py-2.5 rounded-xl border border-slate-300 font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500"
        >
          <template x-for="op in options.operatorOptions" :key="op.value">
            <option :value="op.value" x-text="op.label"></option>
          </template>
        </select>
      </div>

      <!-- Interval -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Pacing</label>
        <select
          x-model="selectedInterval"
          class="w-full px-4 py-2.5 rounded-xl border border-slate-300 font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500"
        >
          <template x-for="inv in options.intervalOptions" :key="inv.value">
            <option :value="inv.value" x-text="inv.label"></option>
          </template>
        </select>
      </div>
    </div>

    <!-- Start Button -->
    <button
      @click="startGame()"
      class="w-full py-4 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-black text-lg shadow-lg hover:shadow-xl transition transform active:scale-[0.99]"
    >
      Start Math Drill 🚀
    </button>
  </div>

  <!-- Active Playing State -->
  <div x-show="gameState === 'playing'" x-cloak class="bg-slate-900 rounded-3xl p-8 sm:p-12 text-white shadow-2xl text-center space-y-6">
    <!-- Top HUD -->
    <div class="flex items-center justify-between text-xs font-semibold text-slate-400 border-b border-slate-800 pb-4">
      <div class="flex items-center gap-2">
        <span>⏱️ Time Left:</span>
        <span class="text-xl font-mono font-black text-amber-400" x-text="timeLeft + 's'"></span>
      </div>
      <div class="flex items-center gap-2">
        <span>Score:</span>
        <span class="text-xl font-mono font-black text-emerald-400" x-text="score + ' / ' + totalAnswered"></span>
      </div>
    </div>

    <!-- Active Math Problem Display -->
    <div class="py-6">
      <div class="text-5xl sm:text-7xl font-mono font-black tracking-wider text-teal-300">
        <span x-text="currentNum1"></span>
        <span class="text-rose-400 mx-2" x-text="selectedOperator"></span>
        <span x-text="currentNum2"></span>
      </div>
    </div>

    <!-- Input Form -->
    <form @submit.prevent="checkAnswer()" class="max-w-xs mx-auto space-y-4">
      <input
        id="mathAnswerInput"
        type="number"
        x-model="userAnswer"
        placeholder="Answer..."
        autocomplete="off"
        class="w-full py-3 px-4 rounded-xl text-center font-mono font-black text-3xl text-slate-900 bg-white focus:outline-none focus:ring-4 focus:ring-teal-400 shadow-inner"
      />
      <div class="flex gap-2">
        <button
          type="submit"
          class="flex-1 py-3 px-4 rounded-xl bg-teal-500 hover:bg-teal-600 text-white font-bold text-sm shadow-md transition"
        >
          Submit [Enter] ↵
        </button>
        <button
          type="button"
          @click="generateProblem()"
          class="py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs"
        >
          Skip →
        </button>
      </div>
    </form>

    <!-- Feedback Flash -->
    <div class="h-6 text-sm font-bold">
      <span x-show="feedback === 'correct'" class="text-emerald-400">✓ Correct!</span>
      <span x-show="feedback === 'incorrect'" class="text-rose-400">✗ Incorrect!</span>
    </div>
  </div>

  <!-- Finished Summary State -->
  <div x-show="gameState === 'finished'" x-cloak class="bg-white rounded-3xl p-8 sm:p-12 shadow-sm border border-slate-200 text-center space-y-6">
    <div class="w-16 h-16 mx-auto rounded-full bg-teal-50 text-teal-600 flex items-center justify-center text-3xl shadow-sm">
      🏆
    </div>
    <div>
      <h2 class="text-3xl font-extrabold text-slate-900 mb-1">Drill Completed!</h2>
      <p class="text-slate-500 text-sm">Great mental workout session</p>
    </div>

    <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto text-left">
      <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
        <span class="text-xs text-slate-400 font-semibold block uppercase">Final Score</span>
        <span class="text-2xl font-black text-slate-900" x-text="score + ' / ' + totalAnswered"></span>
      </div>
      <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
        <span class="text-xs text-slate-400 font-semibold block uppercase">Accuracy</span>
        <span class="text-2xl font-black text-teal-600" x-text="totalAnswered > 0 ? Math.round((score / totalAnswered) * 100) + '%' : '0%'"></span>
      </div>
    </div>

    <div class="flex gap-3 justify-center">
      <button
        @click="startGame()"
        class="py-3 px-8 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm shadow-md transition"
      >
        Play Again 🔄
      </button>
      <button
        @click="resetGame()"
        class="py-3 px-6 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm transition"
      >
        Change Settings ⚙️
      </button>
    </div>
  </div>

</div>
{{ end }}
