{{ define "main" }}
<div class="space-y-8" x-data="{
  piData: {{ .Site.Data.pi | jsonify }},
  paoData: {{ .Site.Data.dominic.pao | jsonify }},
  viewMode: 'pao', // 'pao', 'grid', 'raw'
  searchQuery: '',
  limit: 100,

  get rawDigits() {
    return this.piData.digits || '';
  },

  get fourDigitChunks() {
    const digits = this.rawDigits;
    const chunks = [];
    for (let i = 0; i < digits.length; i += 4) {
      chunks.push(digits.slice(i, i + 4));
    }
    return chunks;
  },

  get paoList() {
    const chunks = this.fourDigitChunks;
    const list = [];
    for (let i = 0; i < chunks.length; i++) {
      const chunk = chunks[i];
      if (chunk.length < 4) continue;
      const personNum = chunk.slice(0, 2);
      const actionNum = chunk.slice(2, 4);
      const personObj = window.MemoryUtils.gettingObjectByNumber(this.paoData, personNum) || {};
      const actionObj = window.MemoryUtils.gettingObjectByNumber(this.paoData, actionNum) || {};

      list.push({
        index: i + 1,
        chunk,
        personNum,
        actionNum,
        person: personObj.person || 'Unknown',
        personImg: personObj.image || '',
        action: actionObj.fullAction || actionObj.action || 'Unknown Action'
      });
    }
    return list;
  },

  get filteredPAO() {
    if (!this.searchQuery.trim()) return this.paoList.slice(0, this.limit);
    const q = this.searchQuery.toLowerCase().trim();
    return this.paoList.filter(item => 
      item.chunk.includes(q) ||
      item.person.toLowerCase().includes(q) ||
      item.action.toLowerCase().includes(q) ||
      item.index.toString() === q
    );
  }
}">

  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-4">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-900">🥧 Pi 4,400 PAO Drill</h1>
      <p class="text-slate-500 text-sm mt-1">4,400 digits of Pi translated into Person-Action stories (2-digit person + 2-digit action)</p>
    </div>
    
    <!-- View Switcher -->
    <div class="flex items-center gap-1.5 bg-slate-100 p-1.5 rounded-xl self-start sm:self-auto text-xs font-bold">
      <button
        @click="viewMode = 'pao'"
        class="px-3 py-1.5 rounded-lg transition"
        :class="viewMode === 'pao' ? 'bg-white text-teal-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'"
      >
        PAO Stories
      </button>
      <button
        @click="viewMode = 'grid'"
        class="px-3 py-1.5 rounded-lg transition"
        :class="viewMode === 'grid' ? 'bg-white text-teal-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'"
      >
        4-Digit Grid
      </button>
      <button
        @click="viewMode = 'raw'"
        class="px-3 py-1.5 rounded-lg transition"
        :class="viewMode === 'raw' ? 'bg-white text-teal-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'"
      >
        Raw Text
      </button>
    </div>
  </div>

  <!-- PAO Stories View -->
  <div x-show="viewMode === 'pao'" class="space-y-6">
    <!-- Filter -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="relative w-full sm:w-96">
        <input
          type="text"
          x-model="searchQuery"
          placeholder="Filter by 4-digit number, person, action, or #..."
          class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm"
        />
        <svg class="w-5 h-5 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
      <div class="text-xs text-slate-500 font-medium">
        Showing <span class="font-bold text-slate-900" x-text="filteredPAO.length"></span> of <span x-text="paoList.length"></span> blocks
      </div>
    </div>

    <!-- Stories Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <template x-for="item in filteredPAO" :key="item.index">
        <div class="p-4 rounded-xl bg-white border border-slate-200 hover:border-teal-400 hover:shadow-sm transition flex items-start gap-4">
          <!-- Chunk Badge -->
          <div class="text-center">
            <span class="block text-xs font-mono font-bold text-slate-400 mb-1" x-text="'#' + item.index"></span>
            <div class="px-2.5 py-1.5 rounded-lg bg-teal-50 border border-teal-200 font-mono font-black text-teal-800 text-base tracking-wider" x-text="item.chunk"></div>
          </div>

          <!-- Person & Action -->
          <div class="flex-1 space-y-1">
            <div class="flex items-center gap-2">
              <span class="text-xs font-mono font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-700" x-text="item.personNum"></span>
              <span class="font-bold text-slate-900 text-sm" x-text="item.person"></span>
            </div>
            <div class="flex items-center gap-2 text-xs">
              <span class="font-mono font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-700" x-text="item.actionNum"></span>
              <span class="text-slate-600 font-medium" x-text="item.action"></span>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- Load More button if not searching -->
    <template x-if="!searchQuery && limit < paoList.length">
      <div class="text-center pt-4">
        <button
          @click="limit += 100"
          class="px-6 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition"
        >
          Load Next 100 Digits (Remaining: <span x-text="paoList.length - limit"></span>) ↓
        </button>
      </div>
    </template>
  </div>

  <!-- 4-Digit Grid View -->
  <div x-show="viewMode === 'grid'" x-cloak class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
    <div class="text-xs text-slate-500 font-medium">1,100 blocks of 4 digits (3.1415...)</div>
    <div class="flex flex-wrap gap-2">
      <template x-for="(chunk, idx) in fourDigitChunks" :key="idx">
        <div class="px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-200 font-mono text-sm font-bold text-slate-800 hover:bg-teal-50 hover:border-teal-300 hover:text-teal-900 transition cursor-default">
          <span class="text-[10px] text-slate-400 font-normal mr-1" x-text="(idx + 1) + ':'"></span>
          <span x-text="chunk"></span>
        </div>
      </template>
    </div>
  </div>

  <!-- Raw Text View -->
  <div x-show="viewMode === 'raw'" x-cloak class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
    <div class="flex items-center justify-between pb-2 border-b border-slate-100">
      <h2 class="text-sm font-bold text-slate-800">Complete 4,400 Decimal Digits of Pi</h2>
      <span class="text-xs text-slate-400 font-mono">3. + 4400 digits</span>
    </div>
    <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 font-mono text-xs text-slate-700 leading-relaxed break-all select-all">
      3.<span x-text="rawDigits"></span>
    </div>
  </div>

</div>
{{ end }}
