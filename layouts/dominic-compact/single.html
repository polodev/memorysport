{{ define "main" }}
<div class="space-y-6" x-data="{
  search: '',
  items: {{ .Site.Data.dominic.pao | jsonify }},
  get filteredItems() {
    if (!this.search.trim()) return this.items;
    const q = this.search.toLowerCase().trim();
    return this.items.filter(item => 
      (item.number && item.number.toString().includes(q)) ||
      (item.letter && item.letter.toLowerCase().includes(q)) ||
      (item.person && item.person.toLowerCase().includes(q)) ||
      (item.fullAction && item.fullAction.toLowerCase().includes(q)) ||
      (item.object && item.object.toLowerCase().includes(q))
    );
  }
}">

  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-4">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-900">Dominic System (Compact Table)</h1>
      <p class="text-slate-500 text-sm mt-1">Quick-reference tabular overview of numbers 00 to 99</p>
    </div>
    <div class="flex gap-2">
      <a href="{{ "dominic/" | relURL }}" class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-semibold text-slate-700 hover:bg-slate-100 transition">Grid Cards</a>
      <a href="{{ "dominic-quiz/" | relURL }}" class="px-3 py-1.5 rounded-lg bg-teal-600 text-xs font-semibold text-white hover:bg-teal-700 transition">Practice Quiz</a>
    </div>
  </div>

  <!-- Search input -->
  <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex items-center justify-between gap-4">
    <div class="relative w-full max-w-md">
      <input
        type="text"
        x-model="search"
        placeholder="Search number, letter, person, or action..."
        class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm"
      />
      <svg class="w-5 h-5 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    </div>
    <span class="text-xs text-slate-500 font-medium whitespace-nowrap">
      <strong class="text-slate-900" x-text="filteredItems.length"></strong> results
    </span>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold text-xs uppercase tracking-wider">
            <th class="py-3 px-4">#</th>
            <th class="py-3 px-4">Letters</th>
            <th class="py-3 px-4">Person</th>
            <th class="py-3 px-4">Action</th>
            <th class="py-3 px-4">Object</th>
            <th class="py-3 px-4">Hints</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <template x-for="item in filteredItems" :key="item.number">
            <tr class="hover:bg-teal-50/50 transition">
              <td class="py-2.5 px-4 font-mono font-bold text-teal-700" x-text="item.number"></td>
              <td class="py-2.5 px-4 font-semibold text-slate-700 uppercase" x-text="item.letter"></td>
              <td class="py-2.5 px-4 font-medium text-slate-900" x-text="item.person"></td>
              <td class="py-2.5 px-4 text-slate-700" x-text="item.fullAction || item.action"></td>
              <td class="py-2.5 px-4 text-slate-600" x-text="item.object || '—'"></td>
              <td class="py-2.5 px-4 text-xs text-slate-400 italic" x-text="item.hints !== 'no hints added yet' ? item.hints : ''"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

</div>
{{ end }}
