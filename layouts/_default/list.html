{{ define "main" }}
<div class="space-y-6">
  <h1 class="text-3xl font-extrabold text-slate-900">{{ .Title }}</h1>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="block p-4 rounded-xl bg-white border border-slate-200 hover:border-teal-500 hover:shadow-sm transition">
        <h2 class="font-bold text-slate-900 text-lg">{{ .Title }}</h2>
        {{ if .Description }}<p class="text-slate-500 text-sm mt-1">{{ .Description }}</p>{{ end }}
      </a>
    {{ end }}
  </div>
</div>
{{ end }}
