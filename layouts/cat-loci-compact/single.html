{{ define "main" }}
<div class="space-y-6" x-data="{
  palaces: {{ .Site.Data.catloci | jsonify }},
  search: '',

  get summaryList() {
    const list = [];
    for (const [key, rooms] of Object.entries(this.palaces)) {
      const roomList = rooms || [];
      const totalNooks = roomList.reduce((acc, r) => acc + (r.nooks ? r.nooks.length : 0), 0);
      list.push({
        key,
        name: key.replace(/([A-Z0-9])/g, ' $1').replace(/^./, str => str.toUpperCase()),
        roomsCount: roomList.length,
        nooksCount: totalNooks,
        rooms: roomList
      });
    }
    return list;
  },

  get filteredList() {
    if (!this.search.trim()) return this.summaryList;
    const q = this.search.toLowerCase();
    return this.summaryList.filter(item => 
      item.name.toLowerCase().includes(q) ||
      item.rooms.some(r => r.title.toLowerCase().includes(q))
    );
  }
}">

  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-4">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-900">Cat Loci (Compact Overview)</h1>
      <p class="text-slate-500 text-sm mt-1">High-level directory of all 22 memory palaces, rooms, and station counts</p>
    </div>
    <a href="{{ "cat-loci/" | relURL }}" class="px-3 py-1.5 rounded-lg bg-teal-600 text-xs font-semibold text-white hover:bg-teal-700 transition">
      Palace Explorer →
    </a>
  </div>

  <!-- Search Filter -->
  <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex items-center justify-between gap-4">
    <div class="relative w-full max-w-md">
      <input
        type="text"
        x-model="search"
        placeholder="Search memory palaces or rooms..."
        class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm"
      />
      <svg class="w-5 h-5 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    </div>
    <span class="text-xs text-slate-500 font-medium">
      <strong class="text-slate-900" x-text="filteredList.length"></strong> Palaces
    </span>
  </div>

  <!-- Palaces Table -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <table class="w-full text-left border-collapse text-sm">
      <thead>
        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold text-xs uppercase tracking-wider">
          <th class="py-3 px-4">#</th>
          <th class="py-3 px-4">Palace Name</th>
          <th class="py-3 px-4 text-center">Rooms / Places</th>
          <th class="py-3 px-4 text-center">Total Nooks</th>
          <th class="py-3 px-4 text-right">Action</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        <template x-for="(palace, idx) in filteredList" :key="palace.key">
          <tr class="hover:bg-teal-50/40 transition">
            <td class="py-3 px-4 font-mono font-bold text-slate-400" x-text="idx + 1"></td>
            <td class="py-3 px-4 font-bold text-slate-900" x-text="palace.name"></td>
            <td class="py-3 px-4 text-center font-semibold text-slate-700" x-text="palace.roomsCount"></td>
            <td class="py-3 px-4 text-center font-bold text-teal-700" x-text="palace.nooksCount"></td>
            <td class="py-3 px-4 text-right">
              <a :href="'{{ "cat-loci/" | relURL }}'" class="text-xs font-semibold text-teal-600 hover:text-teal-800">
                View Palace →
              </a>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

</div>
{{ end }}
