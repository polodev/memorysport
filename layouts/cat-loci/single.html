{{ define "main" }}
<div class="space-y-8" x-data="{
  palaces: {{ .Site.Data.catloci | jsonify }},
  selectedPalaceKey: 'fatepurHome',
  searchQuery: '',

  get palaceKeys() {
    return Object.keys(this.palaces);
  },

  get currentRooms() {
    return this.palaces[this.selectedPalaceKey] || [];
  },

  get totalNooks() {
    return this.currentRooms.reduce((acc, room) => acc + (room.nooks ? room.nooks.length : 0), 0);
  },

  formatPalaceName(key) {
    return key.replace(/([A-Z0-9])/g, ' $1').replace(/^./, str => str.toUpperCase());
  },

  filteredRooms() {
    if (!this.searchQuery.trim()) return this.currentRooms;
    const q = this.searchQuery.toLowerCase().trim();
    return this.currentRooms.map(room => {
      const matchingNooks = (room.nooks || []).filter(nook => nook.toLowerCase().includes(q));
      if (room.title.toLowerCase().includes(q) || matchingNooks.length > 0) {
        return {
          title: room.title,
          nooks: matchingNooks.length > 0 ? matchingNooks : room.nooks
        };
      }
      return null;
    }).filter(Boolean);
  },

  getLeftNooks(nooks) {
    if (!nooks || nooks.length === 0) return [];
    const mid = Math.ceil(nooks.length / 2);
    return nooks.slice(0, mid).map((nook, i) => ({
      text: nook.replace(/^.*###\s*/, ''),
      num: i + 1
    }));
  },

  getRightNooks(nooks) {
    if (!nooks || nooks.length === 0) return [];
    const mid = Math.ceil(nooks.length / 2);
    return nooks.slice(mid).map((nook, i) => ({
      text: nook.replace(/^.*###\s*/, ''),
      num: mid + i + 1
    }));
  }
}">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-4">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-900">Cat Loci (Memory Palaces)</h1>
      <p class="text-slate-500 text-sm mt-1">Spatial memory journeys mapped to real-life locations and nooks</p>
    </div>
    <div class="flex gap-2">
      <a href="{{ "cat-loci-compact/" | relURL }}" class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-semibold text-slate-700 hover:bg-slate-100 transition">Compact Overview</a>
      <a href="{{ "detail-loci/" | relURL }}" class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-semibold text-slate-700 hover:bg-slate-100 transition">Detail Loci</a>
      <a href="{{ "loci-timer/" | relURL }}" class="px-3 py-1.5 rounded-lg bg-teal-600 text-xs font-semibold text-white hover:bg-teal-700 transition">⏱️ Speed Timer</a>
    </div>
  </div>

  <!-- Palace Selector & Search -->
  <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
      <!-- Palace selector dropdown -->
      <div class="md:col-span-2">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Choose Memory Palace</label>
        <select
          x-model="selectedPalaceKey"
          class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-slate-800 font-bold text-base focus:outline-none focus:ring-2 focus:ring-teal-500"
        >
          <template x-for="key in palaceKeys" :key="key">
            <option :value="key" x-text="formatPalaceName(key) + ' (' + (palaces[key] ? palaces[key].length : 0) + ' rooms)'"></option>
          </template>
        </select>
      </div>

      <!-- Search inside palace -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Filter Stations</label>
        <input
          type="text"
          x-model="searchQuery"
          placeholder="Filter nooks in this palace..."
          class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
      </div>
    </div>

    <!-- Palace Stats Banner -->
    <div class="pt-4 border-t border-slate-100 flex flex-wrap items-center gap-4 text-xs font-semibold text-slate-600">
      <span class="px-3 py-1 rounded-full bg-teal-50 text-teal-700">
        🏛️ <strong x-text="currentRooms.length"></strong> Rooms / Locations
      </span>
      <span class="px-3 py-1 rounded-full bg-blue-50 text-blue-700">
        📍 <strong x-text="totalNooks"></strong> Total Nooks / Stations
      </span>
    </div>
  </div>

  <!-- Rooms & Nooks Explorer -->
  <div class="space-y-6">
    <template x-for="(room, rIdx) in filteredRooms()" :key="rIdx">
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
        <!-- Room Title Header -->
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
          <div class="flex items-center gap-3">
            <span class="w-8 h-8 rounded-lg bg-teal-600 text-white font-mono font-bold flex items-center justify-center text-sm shadow-sm" x-text="rIdx + 1"></span>
            <h2 class="text-lg font-bold text-slate-900" x-text="room.title"></h2>
          </div>
          <span class="text-xs font-semibold px-2.5 py-1 bg-slate-100 rounded-lg text-slate-600" x-text="(room.nooks ? room.nooks.length : 0) + ' nooks'"></span>
        </div>

        <!-- Nooks List: Column-Flow (1, 2, 3 on Left Column, then continues on Right Column) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
          <!-- Left Column (1 to mid) -->
          <ul class="space-y-2">
            <template x-for="item in getLeftNooks(room.nooks)" :key="item.num">
              <li class="p-2.5 rounded-xl bg-slate-50 border border-slate-100 hover:bg-teal-50/50 hover:border-teal-200 transition flex items-start gap-2.5">
                <span class="font-mono text-xs font-bold text-teal-600 mt-0.5" x-text="item.num + '.'"></span>
                <span class="text-slate-700 font-medium" x-text="item.text"></span>
              </li>
            </template>
          </ul>

          <!-- Right Column (mid+1 to end) -->
          <ul class="space-y-2">
            <template x-for="item in getRightNooks(room.nooks)" :key="item.num">
              <li class="p-2.5 rounded-xl bg-slate-50 border border-slate-100 hover:bg-teal-50/50 hover:border-teal-200 transition flex items-start gap-2.5">
                <span class="font-mono text-xs font-bold text-teal-600 mt-0.5" x-text="item.num + '.'"></span>
                <span class="text-slate-700 font-medium" x-text="item.text"></span>
              </li>
            </template>
          </ul>
        </div>
      </div>
    </template>
  </div>

</div>
{{ end }}
