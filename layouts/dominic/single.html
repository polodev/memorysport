{{ define "main" }}
<div class="space-y-8" x-data="{
  search: '',
  items: {{ .Site.Data.dominic.pao | jsonify }},
  numberMap: {{ .Site.Data.dominic.numbers | jsonify }},
  get filteredItems() {
    if (!this.search.trim()) return this.items;
    const q = this.search.toLowerCase().trim();
    return this.items.filter(item => 
      (item.number && item.number.toString().includes(q)) ||
      (item.letter && item.letter.toLowerCase().includes(q)) ||
      (item.person && item.person.toLowerCase().includes(q)) ||
      (item.action && item.action.toLowerCase().includes(q)) ||
      (item.fullAction && item.fullAction.toLowerCase().includes(q)) ||
      (item.object && item.object.toLowerCase().includes(q))
    );
  }
}">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-6">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-900">Dominic PAO System</h1>
      <p class="text-slate-500 text-sm mt-1">100 Person-Action-Object associations for numbers 00 to 99</p>
    </div>
    <div class="flex gap-2">
      <a href="{{ "dominic-compact/" | relURL }}" class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-semibold text-slate-700 hover:bg-slate-100 transition">Compact View</a>
      <a href="{{ "dominic-hotel/" | relURL }}" class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-semibold text-slate-700 hover:bg-slate-100 transition">Hotel (0-9999)</a>
      <a href="{{ "dominic-quiz/" | relURL }}" class="px-3 py-1.5 rounded-lg bg-teal-600 text-xs font-semibold text-white hover:bg-teal-700 shadow-sm transition">⚡ Practice Quiz</a>
    </div>
  </div>

  <!-- Dominic Digit to Letter Code Table -->
  <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
    <h2 class="text-lg font-bold text-slate-900 mb-3 flex items-center gap-2">
      <span>Dominic Number to Letter Mapping</span>
      <span class="text-xs font-normal text-slate-400">(0 to 9)</span>
    </h2>
    <div class="grid grid-cols-5 sm:grid-cols-10 gap-2">
      <template x-for="item in numberMap" :key="item.index">
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-center">
          <div class="text-xs text-slate-400 font-semibold mb-1" x-text="'Digit ' + item.index"></div>
          <div class="text-xl font-black text-teal-600" x-text="item.letter"></div>
        </div>
      </template>
    </div>
  </div>

  <!-- Search & Filter Bar -->
  <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
    <div class="relative w-full sm:w-96">
      <input
        type="text"
        x-model="search"
        placeholder="Filter by number, letters, person, or object..."
        class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm"
      />
      <svg class="w-5 h-5 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    </div>
    <div class="text-xs text-slate-500 font-medium">
      Showing <span class="font-bold text-slate-800" x-text="filteredItems.length"></span> of <span x-text="items.length"></span> entries
    </div>
  </div>

  <!-- PAO Cards Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <template x-for="item in filteredItems" :key="item.number">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition flex flex-col justify-between">
        <!-- Card Header & Image -->
        <div>
          <div class="p-4 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
            <span class="text-2xl font-black text-slate-900 tracking-tight" x-text="item.number"></span>
            <span class="px-2.5 py-1 rounded-full text-xs font-bold uppercase bg-teal-100 text-teal-800 tracking-wider" x-text="item.letter"></span>
          </div>

          <!-- Image if available -->
          <div class="h-44 bg-slate-100 overflow-hidden relative flex items-center justify-center">
            <template x-if="item.image">
              <img
                :src="'{{ "" | relURL }}' + item.image"
                :alt="item.person"
                class="w-full h-full object-cover object-top hover:scale-105 transition-transform duration-300"
                onerror="this.style.display='none'"
              />
            </template>
            <template x-if="!item.image">
              <div class="text-slate-400 text-3xl font-bold">PAO</div>
            </template>
          </div>

          <!-- Details -->
          <div class="p-4 space-y-2 text-sm">
            <div>
              <span class="text-xs uppercase font-bold text-slate-400 tracking-wider block">Person</span>
              <span class="font-bold text-slate-800 text-base" x-text="item.person || '—'"></span>
            </div>
            <div>
              <span class="text-xs uppercase font-bold text-slate-400 tracking-wider block">Action</span>
              <span class="text-slate-700" x-text="item.fullAction || item.action || '—'"></span>
            </div>
            <template x-if="item.object">
              <div>
                <span class="text-xs uppercase font-bold text-slate-400 tracking-wider block">Object</span>
                <span class="text-slate-600 font-medium" x-text="item.object"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Hints / Alternatives footer if present -->
        <template x-if="item.hints && item.hints !== 'no hints added yet'">
          <div class="p-3 bg-slate-50 border-t border-slate-100 text-xs text-slate-500 italic" x-text="item.hints"></div>
        </template>
      </div>
    </template>
  </div>

</div>
{{ end }}
