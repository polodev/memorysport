{{ define "main" }}
<div class="space-y-6" x-data="{
  numbers: Array.from({ length: 330 }, (_, i) => i + 1),
  search: '',
  get filteredNumbers() {
    if (!this.search.trim()) return this.numbers;
    return this.numbers.filter(n => n.toString().includes(this.search.trim()));
  }
}">

  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-4">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-900">Numbers (1 to 330)</h1>
      <p class="text-slate-500 text-sm mt-1">Complete reference index for memory stations and peg assignments</p>
    </div>
    <div class="w-full sm:w-64">
      <input
        type="text"
        x-model="search"
        placeholder="Filter number..."
        class="w-full px-4 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
      />
    </div>
  </div>

  <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
    <div class="flex flex-wrap gap-2">
      <template x-for="n in filteredNumbers" :key="n">
        <a
          :href="'{{ "dominic-hotel/" | relURL }}'"
          class="w-12 h-10 rounded-xl bg-slate-50 border border-slate-200 font-mono font-bold text-xs text-slate-700 flex items-center justify-center hover:bg-teal-50 hover:border-teal-400 hover:text-teal-800 transition"
          x-text="n"
        ></a>
      </template>
    </div>
  </div>

</div>
{{ end }}
